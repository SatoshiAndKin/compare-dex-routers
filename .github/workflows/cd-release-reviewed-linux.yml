name: Reviewed Linux tagged release

on:
  workflow_call:
    secrets:
      SENTRY_AUTH_TOKEN:
        required: false
      SENTRY_ORG:
        required: false
      SENTRY_PROJECT:
        required: false

permissions: {}

jobs:
  release:
    if: github.repository == 'SatoshiAndKin/compare-dex-routers' && startsWith(github.ref, 'refs/tags/v')
    runs-on:
      group: ski-ci-public-linux
      labels: ski-kvm-public-pr
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true

      - name: Post deployment summary
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo '## Deployment Summary'
            printf -- '- **Version**: %s\n' "$TAG"
            printf -- '- **API Image**: ghcr.io/%s-api:%s\n' "$REPOSITORY" "$TAG"
            printf -- '- **Frontend Image**: ghcr.io/%s-frontend:%s\n' "$REPOSITORY" "$TAG"
            printf -- '- **Commit**: %s\n' "$(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Sentry of deploy
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          release=$(git rev-parse HEAD)
          curl -sL https://sentry.io/get-cli/ | bash
          sentry-cli releases new "$release"
          sentry-cli releases set-commits "$release" --auto
          sentry-cli releases finalize "$release"
          sentry-cli releases deploys "$release" new -e production
