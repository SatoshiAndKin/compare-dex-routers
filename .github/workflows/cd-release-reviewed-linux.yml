name: Reviewed Linux tagged release

on:
  workflow_call:
    secrets:
      SENTRY_AUTH_TOKEN:
        required: false
      SENTRY_ORG:
        required: false
      SENTRY_PROJECT:
        required: false

permissions: {}

jobs:
  release:
    if: github.repository == 'SatoshiAndKin/compare-dex-routers' && startsWith(github.ref, 'refs/tags/v')
    runs-on:
      group: ski-ci-public-linux
      labels: ski-kvm-public-pr
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          generate_release_notes: true

      - name: Post deployment summary
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo '## Deployment Summary'
            printf -- '- **Version**: %s\n' "$TAG"
            printf -- '- **API Image**: ghcr.io/%s-api:%s\n' "$REPOSITORY" "$TAG"
            printf -- '- **Frontend Image**: ghcr.io/%s-frontend:%s\n' "$REPOSITORY" "$TAG"
            printf -- '- **Commit**: %s\n' "$(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Sentry of deploy
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          release=$(git rev-parse HEAD)
          cli="$RUNNER_TEMP/sentry-cli"
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/getsentry/sentry-cli/releases/download/3.8.2/sentry-cli-Linux-x86_64 \
            --output "$cli"
          printf '%s  %s\n' 'c958865f9d4000183509ea21b1f04925d5390de6d8d87386b9e69f2b305070c3' "$cli" | sha256sum --check
          chmod 0700 "$cli"
          "$cli" releases new "$release"
          "$cli" releases set-commits "$release" --auto
          "$cli" releases finalize "$release"
          "$cli" releases deploys "$release" new -e production
