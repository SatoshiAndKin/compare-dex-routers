name: Auto Merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  pull-requests: write
  contents: write
  actions: write

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  auto-merge:
    uses: SatoshiAndKin/compare-dex-routers/.github/workflows/auto-merge-reviewed-linux.yml@0eb83e84f8c57107466525de173b86184f42d69c
