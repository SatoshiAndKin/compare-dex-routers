name: Reviewed Linux Update Spandex

on:
  workflow_call:

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      ${{ github.repository == 'SatoshiAndKin/compare-dex-routers' &&
          github.repository_id == '1165419679' &&
          github.event.repository.default_branch == 'main' &&
          github.ref == 'refs/heads/main' && github.ref_protected &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
          github.workflow_ref == 'SatoshiAndKin/compare-dex-routers/.github/workflows/update-spandex.yml@refs/heads/main' }}
    runs-on:
      group: ski-ci-public-linux
      labels: ski-kvm-public-pr
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    outputs:
      upstream: ${{ steps.pin.outputs.upstream }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trust the checked-out workspace inside the guest
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Update the manifest and exact prepack permission
        id: pin
        run: |
          set -euo pipefail
          upstream=$(git ls-remote https://github.com/SatoshiAndKin/spandex.git refs/heads/main | cut -f1)
          [[ "$upstream" =~ ^[a-f0-9]{40}$ ]]
          previous=$(node scripts/update-spandex-pin.mjs "$upstream")
          if [[ "$upstream" != "$previous" ]]; then
            printf 'upstream=%s\n' "$upstream" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        if: steps.pin.outputs.upstream != ''
      - name: Install the Bun archive extractor
        if: steps.pin.outputs.upstream != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.pin.outputs.upstream != ''
        with:
          bun-version: 1.4.4
      - name: Resolve and verify the pnpm lockfile without write credentials
        if: steps.pin.outputs.upstream != ''
        env:
          UPSTREAM: ${{ steps.pin.outputs.upstream }}
        run: |
          set -euo pipefail
          pnpm install --lockfile-only
          pnpm install --frozen-lockfile --lockfile-only
          node scripts/update-spandex-pin.mjs "$UPSTREAM" --check-lock
          git diff --check
          git diff --quiet -- . ':!packages/api/package.json' ':!pnpm-workspace.yaml' ':!pnpm-lock.yaml'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.pin.outputs.upstream != ''
        with:
          name: spandex-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1

  open-update:
    if: needs.prepare.outputs.upstream != ''
    needs: prepare
    runs-on:
      group: ski-ci-public-linux
      labels: ski-kvm-public-pr
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Install the pinned GitHub CLI
        shell: bash
        run: |
          bin="$RUNNER_TEMP/github-cli"
          mkdir "$bin"
          archive="$bin/gh.tar.gz"
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/cli/cli/releases/download/v2.105.0/gh_2.105.0_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' 79e7ab5db738c48777b696e374f8b428f0647debfb424f44d2f426370407fe2f "$archive" | sha256sum --check
          tar -xzf "$archive" --strip-components=2 -C "$bin" gh_2.105.0_linux_amd64/bin/gh
          echo "$bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spandex-lockfile
          path: ${{ runner.temp }}/spandex-update
      - name: Open one draft for the exact revision and start CI
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ needs.prepare.outputs.upstream }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$UPSTREAM" =~ ^[a-f0-9]{40}$ ]]
          [[ "$REPOSITORY" == SatoshiAndKin/compare-dex-routers ]]
          [[ $(git ls-remote origin refs/heads/main | cut -f1) == "$BASE_SHA" ]] ||
            { echo "CDR main changed; the next scheduled run will retry."; exit 0; }
          [[ $(git ls-remote https://github.com/SatoshiAndKin/spandex.git refs/heads/main | cut -f1) == "$UPSTREAM" ]] ||
            { echo "Spandex main changed; the next scheduled run will use the new SHA."; exit 0; }
          branch="deps/spandex-$UPSTREAM"
          state=$(gh pr list --repo "$REPOSITORY" --base main --head "$branch" --state all --json state,isDraft --jq 'if length == 0 then "NONE" elif .[0].state == "OPEN" and .[0].isDraft then "DRAFT" else "SKIP" end')
          if [[ "$state" == SKIP ]]; then exit 0; fi

          # Only transfer the lockfile from the unprivileged dependency-resolution job.
          lock="$RUNNER_TEMP/spandex-update/pnpm-lock.yaml"
          [[ -f "$lock" && ! -L "$lock" ]]
          node scripts/update-spandex-pin.mjs "$UPSTREAM"
          cp -- "$lock" pnpm-lock.yaml
          node scripts/update-spandex-pin.mjs "$UPSTREAM" --check-lock
          git diff --check
          git add -- packages/api/package.json pnpm-workspace.yaml pnpm-lock.yaml
          [[ $(git diff --cached --name-only | wc -l) -eq 3 ]]

          remote=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          if [[ -z "$remote" ]]; then
            [[ "$state" == NONE ]]
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Update Spandex to ${UPSTREAM:0:12}"
            gh auth setup-git
            git push origin "HEAD:refs/heads/$branch"
            remote=$(git rev-parse HEAD)
          else
            # Never overwrite a branch or run it if a human made other edits.
            git fetch --no-tags --depth=1 origin "refs/heads/$branch"
            git diff --cached --quiet "$remote" -- ||
              { echo "Existing update branch differs; leaving it untouched."; exit 0; }
          fi

          if [[ "$state" == NONE ]]; then
            gh pr create --repo "$REPOSITORY" --base main --head "$branch" --draft \
              --title "Update Spandex to ${UPSTREAM:0:12}" \
              --body "Pins @spandex/core to SatoshiAndKin/spandex@$UPSTREAM and regenerates the pnpm lockfile and exact prepack permission. Review before marking this draft ready."
          fi

          # A PR opened by GITHUB_TOKEN may require approval for its pull_request
          # runs. Dispatch the existing read-only validation explicitly; it cannot deploy.
          previous=$(gh run list --repo "$REPOSITORY" --workflow ci.yml --branch "$branch" \
            --event workflow_dispatch --json headSha --jq "map(select(.headSha == \"$remote\")) | length")
          if [[ "$previous" == 0 ]]; then gh workflow run ci.yml --repo "$REPOSITORY" --ref "$branch"; fi
