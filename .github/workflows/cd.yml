name: CD

on:
  # Manual merges enter here. Auto Merge explicitly dispatches CD because
  # GITHUB_TOKEN suppresses the pull_request closed event too.
  pull_request:
    branches: [main]
    types: [closed]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: write
  pull-requests: read

jobs:
  build-and-push:
    permissions:
      actions: read
      contents: read
      packages: write
      pull-requests: read
    uses: SatoshiAndKin/compare-dex-routers/.github/workflows/cd-build-reviewed-linux.yml@cead3ebde011236d43c1f8bea0da5dcbb7ba5e6e

  deploy:
    needs: build-and-push
    permissions: {}
    uses: SatoshiAndKin/compare-dex-routers/.github/workflows/cd-deploy-reviewed-linux.yml@cead3ebde011236d43c1f8bea0da5dcbb7ba5e6e
    secrets:
      deployment_webhook_secret: ${{ secrets.WEBHOOK_SECRET }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-push
    permissions:
      contents: write
    uses: SatoshiAndKin/compare-dex-routers/.github/workflows/cd-release-reviewed-linux.yml@3da96ed8f6e65065910d41f399dfcff82d5b5715
    secrets:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
