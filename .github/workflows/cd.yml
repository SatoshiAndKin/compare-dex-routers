name: CD

on:
  # Manual merges enter here. Auto Merge explicitly dispatches CD because
  # GITHUB_TOKEN suppresses the pull_request closed event too.
  pull_request:
    branches: [main]
    types: [closed]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: write
  pull-requests: read

jobs:
  build-and-push:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: api
            dockerfile: packages/api/Dockerfile
          - package: frontend
            dockerfile: packages/frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false

      - name: Read source revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Reuse tested Debian package snapshots
        if: matrix.package == 'api'
        id: apt
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/debian-apt-snapshot.sh for-release "Docker (api)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.package }}
          tags: |
            type=raw,value=sha-${{ steps.revision.outputs.sha }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set registry cache address
        id: cache
        env:
          PACKAGE: ${{ matrix.package }}
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${PACKAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and publish by digest for API validation
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ matrix.package != 'api' }}
          tags: ${{ matrix.package != 'api' && steps.meta.outputs.tags || '' }}
          outputs: ${{ matrix.package == 'api' && format('type=image,name={0},name-canonical=true,push-by-digest=true,push=true', steps.cache.outputs.image) || '' }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
          build-args: |
            ${{ matrix.package == 'api' && format('SENTRY_RELEASE={0}', steps.revision.outputs.sha) || '' }}
            ${{ matrix.package == 'api' && format('DEBIAN_ARCHIVE_SNAPSHOT={0}', steps.apt.outputs.archive) || '' }}
            ${{ matrix.package == 'api' && format('DEBIAN_SECURITY_SNAPSHOT={0}', steps.apt.outputs.security) || '' }}
          cache-from: |
            type=registry,ref=${{ steps.cache.outputs.image }}:buildcache
            type=gha,scope=production-${{ matrix.package }}-amd64
          # Auto Merge uses GITHUB_TOKEN, so main push CI is suppressed. Its
          # explicit main dispatch can warm PR-readable cache in this same build.
          # Do not export GHA cache from tag, PR-event, or non-main dispatch refs.
          cache-to: |
            type=registry,ref=${{ steps.cache.outputs.image }}:buildcache,mode=max
            ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && steps.revision.outputs.sha == github.sha && format('type=gha,scope=production-{0}-amd64,mode=max,ignore-error=true', matrix.package) || '' }}

      - name: Test and tag the exact API image
        if: matrix.package == 'api'
        env:
          IMAGE: ${{ steps.cache.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          RELEASE_COMMIT: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          candidate="$IMAGE@$DIGEST"
          docker pull "$candidate"
          bash .github/scripts/check-api-image.sh "$candidate" "$RELEASE_COMMIT"
          bash .github/scripts/tag-tested-image.sh "$IMAGE" "$DIGEST"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Queue production deployment
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_WEBHOOK_URL }}
          DEPLOY_FALLBACK_URL: ${{ vars.DEPLOY_WEBHOOK_FALLBACK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          REPOSITORY: ${{ github.repository }}
          MERGED_COMMIT: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          set -euo pipefail
          : "${DEPLOY_URL:?DEPLOY_WEBHOOK_URL must be set}"
          : "${WEBHOOK_SECRET:?WEBHOOK_SECRET must be set}"
          payload=$(jq -cn --arg repository "$REPOSITORY" --arg commit "$MERGED_COMMIT" \
            '{repository: $repository, commit: $commit, targets: ["compare-dex-routers"]}')
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          request_key="actions-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          receipt=
          for endpoint in "$DEPLOY_URL" "$DEPLOY_FALLBACK_URL"; do
            [[ -n "$endpoint" ]] || continue
            transport=0
            status=$(curl --silent --show-error --connect-timeout 8 --max-time 25 \
              --header "X-Webhook-Secret: $WEBHOOK_SECRET" \
              --header "Idempotency-Key: $request_key" \
              --header 'Content-Type: application/json' --data "$payload" \
              --output "$response" --write-out '%{http_code}' "$endpoint") || transport=$?
            case "$transport:$status" in
              0:200)
                receipt=$(jq -ce 'select(.status == "queued" and (.id | test("^[0-9a-f]{32}$")))' "$response")
                break
                ;;
              6:000|7:000|28:*|52:000|55:*|56:*|0:500|0:502|0:503|0:504)
                printf 'Temporary deployment webhook failure (curl %s, HTTP %s).\n' "$transport" "$status" >&2
                ;;
              *)
                printf 'Deployment webhook rejected the request (curl %s, HTTP %s).\n' "$transport" "$status" >&2
                exit 1
                ;;
            esac
          done
          if [[ -z "$receipt" ]]; then
            echo 'No deployment endpoint confirmed a durable receipt.' >&2
            exit 1
          fi
          printf 'Deployment queued: %s\n' "$receipt"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true

      - name: Post deployment summary
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          {
            echo '## Deployment Summary'
            printf -- '- **Version**: %s\n' "$TAG"
            printf -- '- **API Image**: ghcr.io/%s-api:%s\n' "$REPOSITORY" "$TAG"
            printf -- '- **Frontend Image**: ghcr.io/%s-frontend:%s\n' "$REPOSITORY" "$TAG"
            printf -- '- **Commit**: %s\n' "$(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Sentry of deploy
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          release=$(git rev-parse HEAD)
          curl -sL https://sentry.io/get-cli/ | bash
          sentry-cli releases new "$release"
          sentry-cli releases set-commits "$release" --auto
          sentry-cli releases finalize "$release"
          sentry-cli releases deploys "$release" new -e production
