name: CD

on:
  # Use pull_request closed instead of push:main because auto-merges via
  # GITHUB_TOKEN don't fire push events (GitHub anti-recursion).
  pull_request:
    branches: [main]
    types: [closed]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: api
            dockerfile: packages/api/Dockerfile
          - package: frontend
            dockerfile: packages/frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.package }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set registry cache address
        id: cache
        env:
          PACKAGE: ${{ matrix.package }}
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${PACKAGE}:buildcache" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.cache.outputs.image }}
          cache-to: type=registry,ref=${{ steps.cache.outputs.image }},mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Queue production deployment
        env:
          WEBHOOK_URL: ${{ vars.DEPLOY_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          REPOSITORY: ${{ github.repository }}
          MERGED_COMMIT: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          set -euo pipefail
          : "${WEBHOOK_URL:?DEPLOY_WEBHOOK_URL must be set}"
          : "${WEBHOOK_SECRET:?WEBHOOK_SECRET must be set}"
          payload=$(jq -cn --arg repository "$REPOSITORY" --arg commit "$MERGED_COMMIT" \
            '{repository: $repository, commit: $commit, targets: ["compare-dex-routers"]}')
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 60 \
            --header "X-Webhook-Secret: $WEBHOOK_SECRET" \
            --header 'Content-Type: application/json' --data "$payload" "$WEBHOOK_URL"
          echo 'Tank stored the deployment request. Its worker records the final result separately.'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true

      - name: Post deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API Image**: ghcr.io/${{ github.repository }}-api:${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Image**: ghcr.io/${{ github.repository }}-frontend:${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify Sentry of deploy
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          curl -sL https://sentry.io/get-cli/ | bash
          sentry-cli releases new "${{ github.ref_name }}"
          sentry-cli releases set-commits "${{ github.ref_name }}" --auto
          sentry-cli releases finalize "${{ github.ref_name }}"
          sentry-cli releases deploys "${{ github.ref_name }}" new -e production
