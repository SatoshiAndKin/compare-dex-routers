name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm test
      - name: Dead code check
        run: pnpm run dead-code
      - name: Duplicate code check
        run: pnpm run duplicates
      - name: Dead feature flag check
        run: pnpm run dead-flags
      - name: Verify pinned CDN assets
        run: pnpm run verify:cdn
      - name: Install browser test engines
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Browser checks
        run: pnpm run test:e2e

  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate AGENTS.md exists and is non-empty
        run: |
          test -f AGENTS.md || (echo "AGENTS.md missing" && exit 1)
          test -s AGENTS.md || (echo "AGENTS.md is empty" && exit 1)
          echo "AGENTS.md validated"
      - name: Validate README.md exists
        run: test -f README.md || (echo "README.md missing" && exit 1)
      - name: Check for TODO/FIXME tech debt
        run: |
          echo "## Tech Debt Report"
          grep -rn "TODO\|FIXME\|HACK\|XXX" packages/ --include="*.ts" --include="*.svelte" || echo "No tech debt markers found"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
      - name: Check for large files
        run: |
          find . -not -path './node_modules/*' -not -path './.git/*' -size +5M -type f | while read f; do
            echo "WARNING: Large file detected: $f ($(du -h "$f" | cut -f1))"
            exit 1
          done || echo "No large files found"
