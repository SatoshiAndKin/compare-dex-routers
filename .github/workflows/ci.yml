name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: pr-ci-ci.yml-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - name: Verify generated API types
        run: |
          pnpm run generate:types
          git diff --exit-code -- packages/frontend/src/generated/api-types.d.ts
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm test
      - run: node --import tsx --test scripts/audit-runtime-dependencies.test.ts
      - name: Dead code check
        run: pnpm run dead-code
      - name: Duplicate code check
        run: pnpm run duplicates
      - name: Dead feature flag check
        run: pnpm run dead-flags
      - name: Verify pinned CDN assets
        run: pnpm run verify:cdn
      - name: Install browser test engines
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Browser checks
        run: pnpm run test:e2e

  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate AGENTS.md exists and is non-empty
        run: |
          test -f AGENTS.md || (echo "AGENTS.md missing" && exit 1)
          test -s AGENTS.md || (echo "AGENTS.md is empty" && exit 1)
          echo "AGENTS.md validated"
      - name: Validate README.md exists
        run: test -f README.md || (echo "README.md missing" && exit 1)
      - name: Check for TODO/FIXME tech debt
        run: |
          echo "## Tech Debt Report"
          grep -rn "TODO\|FIXME\|HACK\|XXX" packages/ --include="*.ts" --include="*.svelte" || echo "No tech debt markers found"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - name: Audit dependencies
        id: dependency-audit
        run: |
          report="$RUNNER_TEMP/dependency-audit.json"
          status=0
          pnpm audit --audit-level=high --json > "$report" || status=$?
          if [ "$status" -eq 0 ]; then
            cat "$report"
            exit 0
          fi
          if [ "$status" -ne 1 ] || ! jq -e '
            (.advisories | type == "object") and
            (.metadata.vulnerabilities | (.high + .critical) > 0)
          ' "$report" > /dev/null; then
            cat "$report"
            exit "$status"
          fi
          echo 'classify=true' >> "$GITHUB_OUTPUT"
      - name: Check which affected packages ship
        if: steps.dependency-audit.outputs.classify == 'true'
        run: |
          docker build -f packages/api/Dockerfile -t compare-dex-audit-api .
          docker build -f packages/frontend/Dockerfile --target builder \
            --build-arg CDR_BROWSER_PACKAGE_INVENTORY=/tmp/browser-packages.json \
            -t compare-dex-audit-frontend .
          docker run --rm --entrypoint cat compare-dex-audit-frontend /tmp/browser-packages.json \
            > "$RUNNER_TEMP/browser-packages.json"
          docker run --rm --entrypoint node compare-dex-audit-api --input-type=module -e '
            import { readFileSync, readdirSync } from "node:fs";
            import { docsAssets } from "/app/packages/api/src/docs-assets.ts";
            const packages = new Set();
            for (const file of readdirSync("/app", { recursive: true })) {
              if (!/(^|\/)node_modules\/(?:@[^/]+\/)?[^/]+\/package\.json$/.test(file)) continue;
              const { name, version } = JSON.parse(readFileSync(`/app/${file}`, "utf8"));
              if (typeof name !== "string" || !name || typeof version !== "string" || !version)
                throw new Error(`Missing package identity in ${file}`);
              packages.add(`${name}@${version}`);
            }
            if (!packages.size) throw new Error("API package inventory is empty");
            packages.add(`swagger-ui-dist@${docsAssets.version}`);
            console.log(JSON.stringify([...packages].sort()));
          ' > "$RUNNER_TEMP/api-packages.json"
          node scripts/audit-runtime-dependencies.ts "$RUNNER_TEMP/dependency-audit.json" \
            "$RUNNER_TEMP/api-packages.json" "$RUNNER_TEMP/browser-packages.json"
      - name: Check for large files
        run: |
          find . -not -path './node_modules/*' -not -path './.git/*' -size +5M -type f | while read f; do
            echo "WARNING: Large file detected: $f ($(du -h "$f" | cut -f1))"
            exit 1
          done || echo "No large files found"
