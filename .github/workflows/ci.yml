name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The Spandex updater validates its pinned draft without waiting for PR workflow approval.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-ci.yml-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  linux:
    uses: SatoshiAndKin/compare-dex-routers/.github/workflows/ci-reviewed-linux.yml@15cd029df48d1b0e954acdbca393b49a462d0f45
