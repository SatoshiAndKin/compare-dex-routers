packages:
  - "packages/*"
  - "tools/openapi"

# Supply chain security: wait 7 days (10080 min) before resolving
# newly published versions. 1440 min = 1 day (pnpm default).
minimumReleaseAge: 10080
# When strict, install fails if the latest version is too new.
# Non-strict falls back to the latest version that IS old enough.
minimumReleaseAgeStrict: false
minimumReleaseAgeIgnoreMissingTime: true
# Reviewed exact Curve SDK upgrade; retain the age gate for all other versions.
minimumReleaseAgeExclude:
  - "@curvefi/api@2.71.2"

# Block transitive deps from git repos / tarball URLs
blockExoticSubdeps: true

# Require explicit approval for dependency lifecycle scripts
strictDepBuilds: true
allowBuilds:
  # Browser SDKs do not need optional native WebSocket accelerators or install notices.
  "@reown/appkit": false
  bufferutil: false
  utf-8-validate: false
  es5-ext: true
  esbuild: true
  "@spandex/core@https://codeload.github.com/SatoshiAndKin/spandex/tar.gz/0cc05673f102f77583e99cba024aa240f387d436#path:/packages/core": true

# The OpenAPI generator pins 4.3.1; 4.3.2 fixes GHSA-2883-xcg3-v3hh.
overrides:
  "js-yaml@4.3.1": "4.3.2"
  # Coinbase SDK pins an affected Axios release; use the patched 1.x API.
  "axios@1.16.0": "1.18.0"
  # 1.16.1 fixes both credential-header leaks in the 1.16.0 release.
  "follow-redirects@1.16.0": "1.16.1"
  # Vite 8.3.3 fixes the launch-editor command handling advisories.
  "vite@8.3.2": "8.3.4"
  # Use patched Zod for API schemas and wallet SDK validation (GHSA-mrhx-c7xc-m3w5).
  "zod@<4.6.6": "4.6.7"
